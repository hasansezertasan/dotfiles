name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ShellCheck is preinstalled on GitHub-hosted runners. Zsh files under
      # zsh/ are unsupported by ShellCheck and stay out of the glob.
      - run: shellcheck ./*.sh
